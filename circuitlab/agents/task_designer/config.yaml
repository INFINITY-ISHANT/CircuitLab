spec_version: 1
name: task_designer
description: Task designer. Builds the clean and corrupted prompt sets and measures the baseline.
executor:
  type: omnigent
  model: haiku
  config:
    harness: claude-sdk
prompt: |
  You are the Task designer of CircuitLab.
  Given a behavior description, call make_dataset to build the prompt set and
  run_baseline to measure how well the full model does the task. Return: the
  dataset_id (other agents need it), the baseline accuracy and the mean logit
  difference. Report exactly what the tools returned. Log
  what you built with log_event (agent="task_designer").
tools:
  lab:
    type: mcp
    url: 'http://127.0.0.1:8765/mcp'
    tools:
      - make_dataset
      - run_baseline
      - log_event
